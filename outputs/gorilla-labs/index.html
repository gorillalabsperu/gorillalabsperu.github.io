<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gorilla Labs | Perfil inicial</title>
  <style>
    :root { --ink:#15111b; --muted:#716b77; --violet:#7027b5; --violet-2:#9b4de1; --line:#e9e4ed; --bg:#f7f6f8; --card:rgba(255,255,255,.78); }
    * { box-sizing:border-box } body { margin:0; color:var(--ink); background:var(--bg); font:16px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input,select,textarea { font:inherit } button { cursor:pointer } .app { min-height:100vh; }
    .topbar { height:74px; display:flex; align-items:center; justify-content:space-between; padding:12px clamp(18px,5vw,72px); background:rgba(255,255,255,.78); border-bottom:1px solid rgba(94,56,114,.1); backdrop-filter:blur(16px); position:sticky; top:0; z-index:5; }
    .brand { display:flex; align-items:center; width:62px;height:48px;overflow:hidden;position:relative; }
    .brand img { width:60px;height:60px;object-fit:contain; }
    .admin-open { border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;color:#514b55;font-size:13px }
    .shell { width:min(1050px,100% - 32px); margin:0 auto; padding:35px 0 56px; }.progress { display:flex;gap:7px;margin:0 auto 22px;max-width:960px }.progress i {height:5px;flex:1;border-radius:9px;background:#e4dde8}.progress i.active{background:linear-gradient(90deg,var(--violet),var(--violet-2))}
    .grid { display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start;max-width:960px;margin-inline:auto }.card { background:var(--card); border:1px solid rgba(255,255,255,.95); box-shadow:0 18px 50px #3d1b5712; backdrop-filter:blur(16px); border-radius:28px;padding:clamp(24px,4vw,42px) }.eyebrow{font-size:12px;font-weight:750;letter-spacing:.1em;color:var(--violet);text-transform:uppercase;margin:0 0 8px}h1{font-size:clamp(29px,4vw,45px);line-height:1.05;letter-spacing:-.045em;margin:0 0 13px}h2{font-size:24px;letter-spacing:-.03em;margin:0 0 7px}p{margin:0 0 18px;color:var(--muted)} .hint{font-size:13px;color:#7b7381}.hidden{display:none!important}
    .field-grid {display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:700;color:#403a44}input,select,textarea{width:100%;border:1px solid #dfd9e3;background:#ffffffbd;border-radius:14px;padding:13px 14px;color:var(--ink);outline:none}textarea{min-height:80px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#964ed6;box-shadow:0 0 0 4px #8d39c118}
    .choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:23px 0}.choice{position:relative;text-align:left;border:1px solid #e6e0e9;background:#ffffffa8;border-radius:17px;padding:16px;min-height:74px;color:var(--ink);font-weight:700}.choice span{font-size:12px;display:block;font-weight:500;color:var(--muted);margin-top:3px}.choice.selected{border-color:var(--violet);background:#f6effd;box-shadow:0 0 0 3px #782ab214}.choice.selected:after{content:'✓';position:absolute;right:13px;top:12px;color:#fff;background:var(--violet);width:20px;height:20px;text-align:center;border-radius:50%;font-size:13px;line-height:20px}.choice.small{min-height:55px;padding:12px;font-size:14px}
    .health-form{display:grid;gap:13px}.health-question{padding:14px 15px;border:1px solid #e8e2eb;background:#ffffffa8;border-radius:17px}.health-question h3{font-size:14px;margin:0 0 10px;color:#37313d}.check-grid{display:flex;flex-wrap:wrap;gap:8px}.check-choice{display:inline-flex;align-items:center;gap:8px;border:1px solid #e1dbe5;background:#fff;border-radius:999px;padding:9px 12px;color:#48414d;font-size:13px;font-weight:650;min-height:40px}.check-choice:before{content:'';width:15px;height:15px;border:1.5px solid #b7adbd;border-radius:4px;background:#fff;flex:none}.check-choice.selected{border-color:#9a5bc8;background:#f5eefb;color:#54247b}.check-choice.selected:before{content:'✓';display:grid;place-items:center;border-color:var(--violet);background:var(--violet);color:#fff;font-size:11px;font-weight:800}.binary-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.binary-choice{border:1px solid #e1dbe5;background:#fff;border-radius:12px;padding:10px 14px;color:#514a56;font-size:14px;font-weight:700}.binary-choice.selected{border-color:var(--violet);background:#f5eefb;color:#572484;box-shadow:0 0 0 2px #782ab214}.detail-field{margin-top:11px}.detail-field textarea{min-height:58px;padding:10px 12px}.question-hint{font-size:12px;color:#78717e;margin:0 0 9px}
    .actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:28px}.next,.primary{border:0;border-radius:15px;padding:13px 20px;color:#fff;background:linear-gradient(120deg,#56208a,#8e3bd0);font-weight:750;box-shadow:0 8px 18px #64259b31}.back{border:0;background:transparent;color:#645d69;padding:10px;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}.note{background:#f4eef9;border-radius:14px;padding:12px 14px;font-size:13px;color:#5f5368;margin-top:18px}
    .body-card{position:sticky;top:101px;min-height:650px;overflow:hidden;background:#f1eff2;color:var(--ink)}.body-card:before{content:'';position:absolute;width:270px;height:270px;border-radius:50%;background:#a95de21a;filter:blur(35px);right:-120px;top:-115px}.body-card h2,.body-card p{position:relative}.body-card p{color:#625b67}.model{height:480px;position:relative;display:grid;place-items:center;margin:8px 0}.body-visual{width:180px;height:480px;position:relative;background-color:#f1eff2;background-image:none;background-repeat:no-repeat;background-size:400% 200%;background-position:var(--sprite-x,33.333%) var(--sprite-y,0%);border-radius:18px;transition:background-position .5s ease,filter .35s ease}.body-visual.is-placeholder{filter:saturate(.35) opacity(.62)}.model-caption{position:relative;background:#ffffffb8;border:1px solid #e8e3e9;border-radius:16px;padding:13px;font-size:13px;color:#625b67}.stats{position:relative;display:flex;gap:9px;margin-top:16px}.stat{flex:1;border:1px solid #e4dfe6;background:#ffffffbd;border-radius:14px;padding:11px}.stat b{font-size:17px;display:block}.stat span{font-size:11px;color:#736b78}
    .intro{position:fixed;inset:0;z-index:20;background:#050505;display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:1;transition:opacity .9s ease,background-color .9s ease}.intro video{display:block;width:auto;height:auto;max-width:100vw;max-height:100svh;object-fit:contain;object-position:center;filter:brightness(.9) contrast(1.04);transition:filter .8s ease}.intro.is-ending{background:#f7f6f8}.intro.is-ending video{filter:brightness(1.05) contrast(1.02);opacity:.16}.intro.is-hidden{opacity:0;pointer-events:none}.sound-toggle{position:absolute;z-index:2;right:clamp(16px,4vw,40px);top:clamp(16px,4vw,36px);width:48px;height:48px;border:1px solid #ffffff55;border-radius:50%;color:#fff;background:#1119;backdrop-filter:blur(12px);display:grid;place-items:center;font-size:19px;transition:transform .2s ease,background .2s ease}.sound-toggle:hover{transform:scale(1.05);background:#292929dd}.sound-toggle.needs-audio{width:auto;padding:0 16px;border-radius:999px;font-size:13px;font-weight:700;display:flex;gap:8px;white-space:nowrap}
    .flash{position:fixed;inset:0;z-index:22;background:#fff;opacity:0;pointer-events:none}.flash.on{animation:softFlash .72s ease-out forwards}@keyframes softFlash{0%{opacity:0}35%{opacity:.92}100%{opacity:0}}
    .welcome{position:fixed;inset:0;z-index:21;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse 42% 34% at 50% 34%,rgba(216,190,239,.30),transparent 78%),radial-gradient(ellipse 62% 56% at 50% 48%,rgba(236,228,242,.38),transparent 84%),#f7f6f8;opacity:0;visibility:hidden;transition:opacity 1.1s ease,visibility 1.1s ease,background-color 1.1s ease}.welcome.visible{opacity:1;visibility:visible}.welcome-inner{position:relative;z-index:1;width:min(690px,100%);text-align:center;display:flex;align-items:center;flex-direction:column;gap:0}.welcome-mark{width:230px;height:200px;display:grid;place-items:center;margin-bottom:20px}.welcome-mark img{width:min(100%,220px);height:auto;object-fit:contain;filter:drop-shadow(0 9px 16px #25112b14)}.welcome h1{font-size:clamp(30px,5vw,54px);margin:4px 0 8px;line-height:1.06;letter-spacing:-.04em}.welcome p{font-size:clamp(16px,2vw,20px);color:#77717c;margin:0 0 30px}.welcome .primary{min-width:min(310px,100%);padding:16px 24px;border-radius:16px;background:linear-gradient(120deg,rgba(117,68,158,.84),rgba(161,111,201,.86));font-size:16px}.welcome .primary:focus-visible,.sound-toggle:focus-visible{outline:3px solid #b881eb;outline-offset:3px}
    @media(prefers-reduced-motion:reduce){.intro,.intro video,.welcome{transition-duration:.01ms}.flash.on{animation-duration:.01ms}}
    .summary-list{display:grid;gap:9px;margin-top:20px}.summary-row{border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;padding:10px 0;font-size:14px}.summary-row span{color:var(--muted)}.consent{display:flex;align-items:flex-start;gap:10px;margin-top:22px;font-size:13px;color:#5f5863}.consent input{width:17px;height:17px;flex:none;margin-top:1px}.admin{position:fixed;inset:0;z-index:25;background:#130d1be0;display:grid;place-items:center;padding:20px}.admin-box{width:min(820px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:25px;padding:26px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{border:0;background:#f2eef4;border-radius:50%;width:34px;height:34px}.records{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}.records th,.records td{text-align:left;padding:9px;border-bottom:1px solid #eee}.records th{color:#655b6c}.admin-login{max-width:360px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#251333;color:#fff;border-radius:15px;padding:12px 17px;box-shadow:0 8px 30px #0003;z-index:30}
    @media(max-width:760px){.topbar{height:65px}.shell{padding-top:20px}.grid{grid-template-columns:1fr}.body-card{position:relative;top:0;min-height:auto;order:-1;padding:23px}.body-card h2{font-size:21px}.model{height:370px;margin:0}.body-visual{width:139px;height:370px}.field-grid{grid-template-columns:1fr}.choice-grid{grid-template-columns:1fr}.card{border-radius:23px;padding:24px}.intro video{width:100vw;height:100svh;max-width:100vw;max-height:100svh}.sound-toggle{right:16px;top:16px}.welcome{padding:24px}.welcome-mark{width:180px;height:164px;margin-bottom:15px}.welcome-mark img{width:180px}.welcome .primary{min-width:100%}.records{font-size:11px}.records th:nth-child(n+5),.records td:nth-child(n+5){display:none}}
  </style>
</head>
<body>
  <section class="intro" id="intro" aria-label="Presentación de Gorilla Labs">
    <div class="intro-media"><video id="introVideo" playsinline autoplay preload="auto" aria-label="Video de presentación de Gorilla Labs"><source src="assets/gorilla-intro.mp4" type="video/mp4"></video><span class="intro-glow" aria-hidden="true"></span><span class="intro-watermark-mask" aria-hidden="true"></span></div>
    <button class="sound-toggle" id="soundToggle" type="button" aria-label="Activar sonido" aria-pressed="false">♪</button>
  </section>
  <div class="flash" id="flash" aria-hidden="true"></div>
  <section class="welcome" id="welcome" aria-label="Bienvenida a Gorilla Labs">
    <div class="welcome-inner">
      <div class="welcome-mark"><img src="assets/gorilla-mark-approved.png" alt=""><div class="welcome-wordmark" aria-label="Gorilla Labs"><span>GORILLA</span><span>LABS</span></div></div>
      <h1>Día 1</h1>
      <p>UN PASO A LA VEZ</p>
      <button class="primary" id="start" type="button">¡Vamos!</button>
    </div>
  </section>
  <main class="app hidden" id="app">
    <header class="topbar"><div class="brand"><img src="assets/gorilla-mark-approved.png" alt="Gorilla Labs"></div><button class="admin-open" id="adminOpen">Acceso administrador</button></header>
    <div class="shell"><div class="progress" id="progress"></div><div class="grid"><section class="card" id="formCard"></section></div></div>
  </main>
  <div class="admin hidden" id="admin"><div class="admin-box" id="adminBox"></div></div><div class="toast hidden" id="toast"></div>
  <script>
  const $=s=>document.querySelector(s), data={}; let step=0;
  const introVideo=$('#introVideo'), soundToggle=$('#soundToggle'); let needsAudioGesture=false, introFinished=false;
  const steps=[
    {title:'Empecemos por conocerte',sub:'Estos datos ayudan a registrar tu perfil inicial.',render:()=>`<div class="field-grid"><div class="field full"><label>Nombre completo</label><input id="name" placeholder="Escribe tu nombre" value="${data.name||''}"></div><div class="field"><label>Teléfono</label><input id="phone" type="tel" placeholder="999 999 999" value="${data.phone||''}"></div><div class="field"><label>Edad</label><select id="age"><option value="">Selecciona</option>${Array.from({length:33},(_,i)=>`<option ${data.age==i+18?'selected':''}>${i+18}</option>`).join('')}</select></div><div class="field"><label>Sexo</label><select id="sex"><option value="">Selecciona</option><option ${data.sex==='Mujer'?'selected':''}>Mujer</option><option ${data.sex==='Hombre'?'selected':''}>Hombre</option></select></div><div class="field"><label>Altura (cm)</label><select id="height"><option value="">Selecciona</option>${Array.from({length:81},(_,i)=>`<option ${data.height==i+140?'selected':''}>${i+140}</option>`).join('')}</select></div><div class="field"><label>Peso (kg)</label><select id="weight"><option value="">Selecciona</option>${Array.from({length:121},(_,i)=>`<option ${data.weight==i+40?'selected':''}>${i+40}</option>`).join('')}</select></div></div>`},
    {title:'¿Cuál es tu objetivo?',sub:'Elige un solo objetivo principal para personalizar las siguientes preguntas.',render:()=>choices('goal',[['Aumentar masa muscular','Quiero aumentar músculo'],['Reducir grasa corporal','Quiero reducir grasa corporal'],['Mejorar resistencia','Quiero sostener mejor el esfuerzo físico']])},
    {title:'Cuéntanos sobre tu actividad',sub:'Selecciona la actividad que más representa tu rutina actual.',render:()=>`${choices('activity',[['No entreno actualmente','Quiero empezar'],['Ejercicio','Actividad en casa o al aire libre'],['Gimnasio','Entrenamiento con máquinas o pesas'],['Otro deporte','Practico una disciplina deportiva']])}<div class="field-grid"><div class="field"><label>Días por semana</label><select id="days"><option value="">Selecciona</option>${[0,1,2,3,4,5,6,7].map(x=>`<option ${data.days==x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Duración por sesión</label><select id="duration"><option value="">Selecciona</option>${['No aplica','Menos de 30 min','30–45 min','45–60 min','Más de 60 min'].map(x=>`<option ${data.duration===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Nivel de actividad habitual</label>${choices('activityLevel',[['Bajo','Sedentario'],['Intermedio','Medianamente activo'],['Alto','Activo']],'activity-level-choices')}</div><div class="field full ${data.activity==='Otro deporte'?'':'hidden'}" id="sportField"><label>¿Qué deporte practicas?</label><input id="sport" placeholder="Ej.: fútbol, MMA, ciclismo" value="${data.sport||''}"></div></div>`},
    {title:'Hablemos de tus hábitos',sub:'No hay respuestas correctas. Tu sinceridad permite una mejor conversación de seguimiento.',render:()=>`<div class="field-grid"><div class="field"><label>Agua al día</label><select id="water">${options(['Selecciona','Menos de 1 litro','1 a 2 litros','Más de 2 litros'],data.water)}</select></div><div class="field"><label>Horas de sueño</label><select id="sleep">${options(['Selecciona','Menos de 5 horas','5 a 6 horas','7 a 8 horas','Más de 8 horas'],data.sleep)}</select></div><div class="field"><label>Comidas al día</label><select id="meals">${options(['Selecciona','1 a 2','3','4 o más'],data.meals)}</select></div><div class="field"><label>¿Incluyes proteína regularmente?</label><select id="protein">${options(['Selecciona','Sí, casi siempre','A veces','Casi nunca'],data.protein)}</select></div></div><div class="note">Estos datos describen hábitos. Las recomendaciones nutricionales específicas deben ser validadas por un profesional.</div>`},
    {title:'Información para el profesional',sub:'Responde con opciones por clic. Este formulario no diagnostica condiciones médicas.',render:()=>`<div class="health-form">${multiQuestion('historyTags','¿Tienes antecedentes médicos que debamos conocer?',['Presión alta','Diabetes','Asma','Tiroides','Condición cardiovascular','Pancreatitis','Problemas digestivos','Problemas renales','Problemas hepáticos','Otro'],'Ninguno','historyOther')}${multiQuestion('allergyTags','¿Tienes alguna alergia?',['Medicamentos','Alimentos','Picaduras','Suplementos','Otra'],'Ninguna','allergyOther')}${binaryQuestion('supplementStatus','¿Tomas suplementos actualmente?',`<p class="question-hint">Marca todos los que correspondan.</p>${multiQuestion('supplementTags','',['Proteína','Creatina','Glutamina','BCAA','Otro'],'','supplementOther')}`)}${binaryQuestion('medicationStatus','¿Tomas medicamentos actualmente?',`<div class="field detail-field"><label for="medicationDetails">¿Cuáles?</label><textarea id="medicationDetails" placeholder="Escribe los nombres">${data.medicationDetails||''}</textarea></div>`)}<div class="health-question"><h3>¿Hay algo más que quieras comentar?</h3><div class="binary-options"><button class="binary-choice ${data.commentStatus==='Omitir'?'selected':''}" type="button" data-binary-key="commentStatus" data-binary-value="Omitir">Omitir</button><button class="binary-choice ${data.commentStatus==='Sí'?'selected':''}" type="button" data-binary-key="commentStatus" data-binary-value="Sí">Sí, agregar detalle</button></div>${data.commentStatus==='Sí'?`<div class="field detail-field"><label for="commentDetails">Escribe tu comentario</label><textarea id="commentDetails" placeholder="Escribe aquí">${data.commentDetails||''}</textarea></div>`:''}</div><div class="note">La información se comparte como referencia para el profesional que realizará la evaluación.</div></div>`},
    {title:'Tu punto de partida',sub:'Este resumen reúne tus datos y una referencia visual para conversar con el profesional.',render:()=>`<div class="summary-list">${[['Edad',data.age?data.age+' años':'—'],['Altura',data.height?data.height+' cm':'—'],['Peso actual',data.weight?data.weight+' kg':'—'],['Objetivo',data.goal],['Actividad',data.activity],['Nivel habitual',data.activityLevel],['Frecuencia',data.days!==undefined?data.days+' día(s) por semana':'—'],['Duración',data.duration],['Rango general por estatura',referenceWeightRange()]].map(([a,b])=>`<div class="summary-row"><span>${a}</span><b>${b||'—'}</b></div>`).join('')}</div><label class="consent"><input type="checkbox" id="consent" ${data.consent?'checked':''}><span>Autorizo a Gorilla Labs a guardar estos datos para gestionar mi perfil inicial y compartirlos con el profesional que realizará la evaluación.</span></label><div class="note">El rango es una referencia estadística basada en estatura e IMC adulto; no representa un peso ideal individual. El IMC no distingue grasa de músculo, por lo que en atletas debe interpretarse con evaluación profesional.</div>`}
  ];
  function options(a,v){return a.map((x,i)=>`<option ${x===v?'selected':''} ${i===0?'value=""':''}>${x}</option>`).join('')}
  function multiQuestion(key,title,items,noneLabel,otherId){const selected=Array.isArray(data[key])?data[key]:[];const all=noneLabel?[noneLabel,...items]:items;return `<div class="health-question"><h3>${title||'Selecciona tus suplementos'}</h3><div class="check-grid" data-multi-key="${key}" data-none-label="${noneLabel||''}">${all.map(item=>`<button type="button" class="check-choice ${selected.includes(item)?'selected':''}" data-multi-value="${item}">${item}</button>`).join('')}</div>${otherId&&(selected.includes('Otro')||selected.includes('Otra'))?`<div class="field detail-field"><label for="${otherId}">Especifica cuál</label><textarea id="${otherId}" placeholder="Escribe aquí">${data[otherId]||''}</textarea></div>`:''}</div>`}
  function binaryQuestion(key,title,yesContent){return `<div class="health-question"><h3>${title}</h3><div class="binary-options"><button type="button" class="binary-choice ${data[key]==='No'?'selected':''}" data-binary-key="${key}" data-binary-value="No">No</button><button type="button" class="binary-choice ${data[key]==='Sí'?'selected':''}" data-binary-key="${key}" data-binary-value="Sí">Sí</button></div>${data[key]==='Sí'?`<div class="detail-field">${yesContent}</div>`:''}</div>`}
  function referenceWeightRange(){const h=Number(data.height)/100;if(!h)return'Pendiente';const min=18.5*h*h,max=24.9*h*h;return`${min.toFixed(1)}–${max.toFixed(1)} kg`}
  function choices(key,arr,extraClass=''){return `<div class="choice-grid ${extraClass}" data-key="${key}">${arr.map(([a,b])=>`<button type="button" class="choice ${data[key]===a?'selected':''}" data-value="${a}" aria-pressed="${data[key]===a}">${a}<span>${b}</span></button>`).join('')}</div>`}
  function value(id){const el=$('#'+id);return el?el.value:undefined}
  function sync(){['name','phone','age','sex','height','weight','days','duration','activityLevel','sport','water','sleep','meals','protein','historyOther','allergyOther','supplementOther','medicationDetails','commentDetails'].forEach(k=>{const v=value(k);if(v!==undefined)data[k]=v});const consent=$('#consent');if(consent)data.consent=consent.checked;updateModel()}
  function validProfessionalInfo(){const history=Array.isArray(data.historyTags)&&data.historyTags.length>0,allergies=Array.isArray(data.allergyTags)&&data.allergyTags.length>0,supplements=data.supplementStatus==='No'||(data.supplementStatus==='Sí'&&Array.isArray(data.supplementTags)&&data.supplementTags.length>0),medication=data.medicationStatus==='No'||(data.medicationStatus==='Sí'&&String(data.medicationDetails||'').trim().length>0),comment=data.commentStatus==='Omitir'||(data.commentStatus==='Sí'&&String(data.commentDetails||'').trim().length>0),historyOther=!data.historyTags?.includes('Otro')||String(data.historyOther||'').trim().length>0,allergyOther=!data.allergyTags?.includes('Otra')||String(data.allergyOther||'').trim().length>0,supplementOther=!data.supplementTags?.includes('Otro')||String(data.supplementOther||'').trim().length>0;return history&&allergies&&supplements&&medication&&comment&&historyOther&&allergyOther&&supplementOther}
  function valid(){ if(step===0)return data.name&&data.phone&&data.age&&data.sex&&data.height&&data.weight; if(step===1)return data.goal; if(step===2)return data.activity!==undefined&&data.activityLevel&&data.days!==''&&data.days!==undefined&&data.duration; if(step===3)return data.water&&data.sleep&&data.meals&&data.protein; if(step===4)return validProfessionalInfo(); if(step===5)return data.consent; return true }
  function render(){const s=steps[step]; $('#progress').innerHTML=steps.map((_,i)=>`<i class="${i<=step?'active':''}"></i>`).join(''); $('#formCard').innerHTML=`<div class="step-brand"><img src="assets/gorilla-mark-approved.png" alt="Gorilla Labs"></div><p class="eyebrow">Paso ${step+1} de ${steps.length}</p><h1>${s.title}</h1><p>${s.sub}</p>${s.render()}<div class="actions"><button class="back ${step?'':'hidden'}" id="back">← Anterior</button><span class="hint ${step?'hidden':''}">Toma menos de 3 minutos</span><button class="next" id="next">${step===steps.length-1?'Guardar perfil':'Continuar →'}</button></div>`; $('#back')?.addEventListener('click',()=>{sync();step--;render()});$('#next').addEventListener('click',()=>{sync();if(!valid()){toast('Completa las opciones requeridas para continuar.');return}if(step===steps.length-1){save();return}step++;render()});document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{data[b.closest('[data-key]').dataset.key]=b.dataset.value;render()}));document.querySelectorAll('[data-multi-value]').forEach(b=>b.addEventListener('click',()=>{sync();const group=b.closest('[data-multi-key]'),key=group.dataset.multiKey,picked=b.dataset.multiValue,none=group.dataset.noneLabel,selected=Array.isArray(data[key])?data[key]:[];if(none&&picked===none)data[key]=selected.includes(picked)?[]:[picked];else data[key]=selected.includes(picked)?selected.filter(x=>x!==picked):[...selected.filter(x=>x!==none),picked];if(!data.historyTags?.includes('Otro'))data.historyOther='';if(!data.allergyTags?.includes('Otra'))data.allergyOther='';if(!data.supplementTags?.includes('Otro'))data.supplementOther='';render()}));document.querySelectorAll('[data-binary-key]').forEach(b=>b.addEventListener('click',()=>{sync();const key=b.dataset.binaryKey,picked=b.dataset.binaryValue;data[key]=picked;if(key==='supplementStatus'&&picked==='No'){data.supplementTags=[];data.supplementOther=''}if(key==='medicationStatus'&&picked==='No')data.medicationDetails='';if(key==='commentStatus'&&picked==='Omitir')data.commentDetails='';render()}));['height','weight','sex','activityLevel'].forEach(i=>$('#'+i)?.addEventListener('change',()=>{sync();updateModel()}));$('#days')?.addEventListener('change',()=>{if(Number(value('days'))===0)$('#duration').value='No aplica';else if(value('duration')==='No aplica')$('#duration').value='';sync()});updateModel()}
  function updateModel(){const h=+data.height,w=+data.weight,bmi=h&&w?w/((h/100)**2):0,days=Number(data.days||0),training=data.activity==='Gimnasio'||data.activity==='Otro deporte'||data.activity==='Ejercicio',active=data.activityLevel==='Alto'||data.activityLevel==='Activo'||(training&&days>=3);let column=1;if(bmi&&bmi<19)column=0;else if(bmi>=28)column=active?2:3;else if(bmi>=23&&active)column=2;const x=['0%','33.333%','66.667%','100%'][column],y=data.sex==='Mujer'?'100%':'0%';const visual=$('#bodyVisual');if(visual){visual.style.setProperty('--sprite-x',x);visual.style.setProperty('--sprite-y',y);visual.classList.toggle('is-placeholder',!h||!w);visual.setAttribute('aria-label',data.sex==='Mujer'?'Figura referencial femenina':'Figura referencial masculina')}$('#heightStat').textContent=h?h+' cm':'—';$('#weightStat').textContent=w?w+' kg':'—';$('#bmiStat').textContent=bmi?bmi.toFixed(1):'—';$('#caption').textContent=bmi?'Referencia visual basada en altura, peso y actividad. No determina grasa corporal ni un peso objetivo.':'Completa altura y peso para ver una referencia visual.'}
  function save(){toast('El registro en línea aún no está conectado. Tus datos no se guardaron.')}
  function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2800)}
  function updateSoundControl(){const active=!introVideo.muted; soundToggle.textContent=needsAudioGesture?'Activar sonido':active?'◖))':'◖';soundToggle.setAttribute('aria-label',needsAudioGesture?'Activar sonido':active?'Silenciar video':'Activar sonido');soundToggle.setAttribute('aria-pressed',String(active));soundToggle.classList.toggle('needs-audio',needsAudioGesture)}
  async function startIntro(){introVideo.muted=false;try{await introVideo.play();needsAudioGesture=false;updateSoundControl()}catch{introVideo.muted=true;needsAudioGesture=true;updateSoundControl();try{await introVideo.play();needsAudioGesture=true;updateSoundControl()}catch{}}}
  soundToggle.addEventListener('click',async()=>{if(needsAudioGesture){introVideo.muted=false;try{await introVideo.play();needsAudioGesture=false}catch{needsAudioGesture=true}}else introVideo.muted=!introVideo.muted;updateSoundControl()});
  function showWelcome(){if(introFinished)return;introFinished=true;$('#intro').classList.add('is-ending');setTimeout(()=>{$('#flash').classList.add('on');$('#welcome').classList.remove('hidden');requestAnimationFrame(()=>$('#welcome').classList.add('visible'))},320);setTimeout(()=>{$('#intro').classList.add('is-hidden');$('#flash').classList.remove('on');$('#start').focus()},1250)}
  introVideo.addEventListener('ended',showWelcome);introVideo.addEventListener('error',()=>{toast('No se pudo cargar el video de presentación.');setTimeout(showWelcome,700)});startIntro();
  $('#start').onclick=()=>{$('#welcome').classList.remove('visible');setTimeout(()=>{$('#welcome').classList.add('hidden');$('#app').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'})},650)};$('#adminOpen').onclick=showAdmin;
  function showAdmin(){const a=$('#admin');a.classList.remove('hidden');a.onclick=e=>{if(e.target===a)a.classList.add('hidden')};$('#adminBox').innerHTML='<div class="admin-head"><div><p class="eyebrow">Zona privada</p><h2>Panel administrativo</h2></div><button class="close" id="close">×</button></div><p class="hint">El registro central aún no está conectado.</p>';$('#close').onclick=()=>a.classList.add('hidden')}
  function exportCSV(){toast('El panel necesita el registro central para exportar.')}
